
# lavender  #ae81ff
# cyan      #66d9ef
# green     #a6e22e
# magenta   #f92a72
# yellow    #e6db74
# orange    #ffa827

set -g status-position top
set -g status-interval 5

# allow scrolling with mouse
# set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# configure status bar

# hide status bar (keep extra line at bottom)
# set-option status-style fg=color15,bg=color232
# set -g status-left ''
# set -g status-right ''
# set -g window-status-current-format ''
# set -g window-status-format ''

# reload tmux config binding
unbind r
bind r source-file ~/.tmux.conf

# split pane vertically
unbind d
bind d split-window -v

# split pane horizontally
unbind v
bind v split-window -h

# resize pane
bind -r e resize-pane -D 5
bind -r i resize-pane -U 5
bind -r o resize-pane -R 5
bind -r n resize-pane -L 5
bind -r m resize-pane -Z

# select pane
unbind s
bind s select-pane -t -1
unbind t
bind t select-pane -t +1

# Cmd pane chords (conditional). Ghostty sends C-b C-v <slot> for the pane
# chords; when the croft pane is focused the raw CSI-u is injected back into it
# so croft wins the chord, otherwise the iTerm-like pane action runs. Using a
# key table (rather than a global M- binding) avoids hijacking real Alt chords.
# The bytes are `send-keys -H` hex; see .config/ghostty/config.
bind -T prefix C-v switch-client -T croft
bind -T croft d if-shell -F '#{==:#{pane_current_command},croft}' 'send-keys -H 1b 5b 31 30 30 3b 39 75' 'split-window -h'
bind -T croft D if-shell -F '#{==:#{pane_current_command},croft}' 'send-keys -H 1b 5b 36 38 3b 31 30 75' 'split-window -v'
bind -T croft w if-shell -F '#{==:#{pane_current_command},croft}' 'send-keys -H 1b 5b 31 31 39 3b 39 75' 'kill-pane'
bind -T croft e if-shell -F '#{==:#{pane_current_command},croft}' 'send-keys -H 1b 5b 31 33 3b 31 30 75' 'resize-pane -Z'
bind -T croft h if-shell -F '#{==:#{pane_current_command},croft}' 'send-keys -H 1b 5b 31 3b 31 31 44' 'select-pane -L'
bind -T croft l if-shell -F '#{==:#{pane_current_command},croft}' 'send-keys -H 1b 5b 31 3b 31 31 43' 'select-pane -R'
bind -T croft k if-shell -F '#{==:#{pane_current_command},croft}' 'send-keys -H 1b 5b 31 3b 31 31 41' 'select-pane -U'
bind -T croft j if-shell -F '#{==:#{pane_current_command},croft}' 'send-keys -H 1b 5b 31 3b 31 31 42' 'select-pane -D'

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# tmux plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# third party plugins
set -g @plugin 'o0th/tmux-nova'

set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left 
set -g @nova-nerdfonts-right 

set -g @nova-segment-mode "⚑"
set -g @nova-segment-mode-colors "#{?client_prefix,#f92a72,#66d9ef} #000000"

set -g @nova-segment-time "#(date +"%H:%M")"
set -g @nova-segment-time-colors "#cfcfc1 #000000"

set -g @nova-pane "#I#{?pane_in_mode,  #{pane_mode},}  #W"

set -g @nova-rows 1
set -g @nova-segments-0-left "mode"
set -g @nova-segments-0-right "time"

set -g @nova-pane-active-border-style "#2a2a2a"
set -g @nova-pane-border-style "#2a2a2a"
set -g @nova-status-style-bg "#000000"
set -g @nova-status-style-fg "#000000"
set -g @nova-status-style-active-bg "#ffa827"
set -g @nova-status-style-active-fg "#000000"
set -g @nova-status-style-double-bg "#000000"

# configure plugins
set -g @resurrect-capture-pane-contents 'on'
# Auto-restore is driven by the dev-workspace launcher (it restores
# synchronously before opening windows), so continuum only handles auto-save.
set -g @continuum-restore 'off'

# The editor and review panes are started by dev-workspace's post-restore hook
# (`start_views_in_shells`), which fills in any pane still sitting at a shell.
# resurrect cannot restore a command with arguments, so nothing is mapped in
# `@resurrect-processes` here. (pi shows up as a generic `node` process and is
# started the same way.)

# After resurrect rebuilds the layout, start pi in the dedicated pi session.
set -g @resurrect-hook-post-restore-all '/Users/joelove/.local/bin/dev-workspace post-restore --all'

# Start tmux panes with a login zsh so they always get the full user
# environment (PATH, prompt), even if the tmux server was launched from a
# minimal launchd-style environment.
set -g default-shell /bin/zsh

# Truecolor support so the nova status bar and croft colors render correctly.
set -as terminal-features ',*:RGB'

# Click a pane to focus it (also enables wheel scroll and border drag-resize).
set -g mouse on

# Left-click a GitHub Actions run row to open it in the browser. running-actions
# emits each row as an OSC 8 hyperlink, and tmux exposes the link under the
# cursor as #{mouse_hyperlink}. Non-link clicks keep the default behaviour:
# focus the pane and forward the click to the application.
bind -T root MouseDown1Pane if-shell -F \
  '#{m/r:actions/runs,#{mouse_hyperlink}}' \
  { select-pane -t = ; run-shell -b "/usr/bin/open #{q:mouse_hyperlink}" } \
  { select-pane -t = ; send-keys -M }

# Expose the tmux window name as the terminal title so dev-workspace can
# find each session's Ghostty window (e.g. with yabai) and swap to its space.
set -g set-titles on
set -g set-titles-string '#S'

# Focused pane: flashing block cursor. Ghostty itself renders a hollow block
# whenever the Ghostty window is unfocused, which covers the unfocused case.
set -g cursor-style blinking-block

# Forward modified keys (e.g. Shift+Enter) to applications. tmux does not know
# xterm-ghostty supports the xterm modifyOtherKeys protocol, so declare the
# extkeys terminal feature; extended-keys on then enables it. Use the CSI-u
# encoding (kitty keyboard protocol) rather than the legacy xterm
# modifyOtherKeys format: Ghostty and Neovim support it, and tools that read
# extended keys (e.g. pi) expect it.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# tmux drops OSC 8 hyperlinks unless the client terminal declares the
# hyperlinks feature. Ghostty supports them, so keep the link attached and
# Cmd+click opens it in the default browser (matching Ghostty's default).
set -as terminal-features 'xterm*:hyperlinks'

# A tmux window resize re-flows pane sizes, so re-pin every workspace layout
# after the window settles. The command is debounced inside dev-workspace.
set-hook -g window-resized 'run-shell -b "/Users/joelove/.local/bin/dev-workspace normalize-editor --all"'

# initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
