# tmux config for the cloud pi-box (Amazon Linux). scripts/setup-linux.sh links
# this to ~/.tmux.conf. It is deliberately separate from the Mac .tmux.conf:
# there are no Ghostty pane chords, croft key tables, or dev-workspace binds,
# and the shell is bash, not zsh.

# Prefix Ctrl+a, matching the Mac.
set -g prefix C-a
bind C-a send-prefix

set -g status-position bottom
set -g status-interval 5

# UTF-8 locale so pi and tmux render multibyte glyphs.
set-environment -g LANG en_US.UTF-8
set-environment -g LC_CTYPE en_US.UTF-8

# Reload binding.
unbind r
bind r source-file ~/.tmux.conf

# Terminal capabilities for the Ghostty client: extended keys (Shift+Enter)
# and truecolor. Pi warns and drops modified Enter keys without these.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features ',*:RGB'

# Mouse stays off so the Mac's Ghostty owns it: drag selects in the terminal
# (cmd+c copies the selection), scroll uses Ghostty's scrollback, and cmd+click
# opens links. tmux copy-mode is still available on the prefix ([).
set -g mouse off
set -g history-limit 50000
set -g default-shell /bin/bash

# Clipboard passthrough. The box has no GUI clipboard, so the Mac's Ghostty
# client must own it. `set-clipboard on` makes tmux forward OSC 52 from panes
# (pi) and from its own copy-mode copies to the client, and `allow-passthrough`
# lets sequences tmux does not model (OSC 8 links, inline images) reach Ghostty.
# Both cross mosh, which understands OSC 52. A copy-mode copy lands in the Mac
# clipboard; Ghostty opens a cmd+clicked link in the Mac browser.
set -g set-clipboard on
set -g allow-passthrough on

# tmux plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'o0th/tmux-nova'

# Nova: muted monokai, bottom bar. Host on the left, session on the right,
# window list in the middle. Time/date and git branch are intentionally left
# out: the local tmux shows the time, and pi and p10k show the branch.
set -g @nova-nerdfonts true

set -g @nova-segment-whoami "pi-box"
set -g @nova-segment-whoami-colors "#66d9ef #1e1f1c"

set -g @nova-segment-session "#S"
set -g @nova-segment-session-colors "#ae81ff #1e1f1c"

set -g @nova-pane "#I #W"

# One status row: rows 0 keeps tmux at a single line. A value of 1 makes nova
# run `status 2` and add a second, empty fill row below the bar.
set -g @nova-rows 0
set -g @nova-segments-0-left "whoami"
set -g @nova-segments-0-right "session"

set -g @nova-pane-active-border-style "#2a2a2a"
set -g @nova-pane-border-style "#2a2a2a"
set -g @nova-status-style-bg "#1e1f1c"
set -g @nova-status-style-fg "#cfcfc2"
set -g @nova-status-style-active-bg "#3c3728"
set -g @nova-status-style-active-fg "#e6db74"
set -g @nova-status-style-double-bg "#1e1f1c"

# initialize tmux plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
