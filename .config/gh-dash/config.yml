# yaml-language-server: $schema=https://gh-dash.dev/schema.json

# Default profile: all open PRs across github.com/joelove.
# gh-dash appends `sort:updated`, so no sort qualifier here.
prSections:
  - title: "My open PRs"
    filters: >-
      is:open
      user:joelove

# Map local checkouts so checkout/diff work from the TUI.
repoPaths:
  joelove/dotfiles: /Users/joelove/Projects/dotfiles

defaults:
  view: prs
  prsLimit: 50
  refetchIntervalMinutes: 5
  preview:
    open: true

# gh-dash's stock "open in GitHub" key is `o`; here it opens the PR in the
# dev-workspace editor pane (octo.nvim), falling back to the browser.
keybindings:
  prs:
    - key: enter
      name: open in browser
      command: "gh pr view {{.PrNumber}} --repo {{.RepoName}} --web"
    - key: o
      name: review in nvim
      command: "dev-workspace review https://github.com/{{.RepoName}}/pull/{{.PrNumber}}"
