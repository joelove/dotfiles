# yaml-language-server: $schema=https://gh-dash.dev/schema.json

# All open PRs across the Company repos you track.
# gh-dash appends `sort:updated`, so no sort qualifier here.
prSections:
  - title: "Company: open PRs"
    filters: >-
      is:open
      repo:Company-Org/company-match
      repo:Company-Org/company-eval
      repo:Company-Org/company-orchestrator
      repo:Company-Org/company-infra
      repo:Company-Org/company-cms

# Map GitHub repos to local checkouts so checkout/diff work from the TUI.
repoPaths:
  Company-Org/company-match: $HOME/Projects/company/company-match
  Company-Org/company-eval: $HOME/Projects/company/company-eval
  Company-Org/company-orchestrator: $HOME/Projects/company/company-orchestrator
  Company-Org/company-infra: $HOME/Projects/company/company-infra
  Company-Org/company-cms: $HOME/Projects/company/company-cms

defaults:
  view: prs
  prsLimit: 50
  refetchIntervalMinutes: 5
  preview:
    open: true

# gh-dash's stock "open in GitHub" key is `o` (there is no Enter binding).
# Add Enter as an extra binding; `o` still works.
keybindings:
  prs:
    - key: enter
      name: open in browser
      command: "gh pr view {{.PrNumber}} --repo {{.RepoName}} --web"
    - key: O
      name: review in nvim
      command: "company-workspace review https://github.com/{{.RepoName}}/pull/{{.PrNumber}}"
