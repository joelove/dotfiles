# yaml-language-server: $schema=https://gh-dash.dev/schema.json

# Default profile: all open PRs across github.com/joelove.
# gh-dash appends `sort:updated`, so no sort qualifier here.
prSections:
  - title: "My open PRs"
    filters: >-
      is:open
      user:joelove

# Map local checkouts so checkout/diff work from the TUI.
repoPaths:
  joelove/dotfiles: $HOME/Projects/dotfiles

defaults:
  view: prs
  prsLimit: 50
  refetchIntervalMinutes: 5
  preview:
    open: true

# Denser table: drop the per-section count, row separators, and row padding.
# (gh-dash's own title/separator header cannot be hidden.)
theme:
  ui:
    sectionsShowCount: false
    table:
      compact: true
      showSeparator: false

# Stock gh-dash keys: `o` opens the PR in the browser, `enter` views it.
# `l` loads the selected PR into the lumen review tab of the dev-workspace swap
# pane (see `.local/bin/dev-workspace open-review`); `o` still opens the browser.
keybindings:
  prs:
    - key: l
      command: $HOME/.local/bin/dev-workspace open-review --path "{{.RepoPath}}" --repo "{{.RepoName}}" --pr "{{.PrNumber}}"
