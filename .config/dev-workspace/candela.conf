# candela profile for dev-workspace.
# Session names are pinned to the originals so the existing tmux-resurrect save
# still matches; everything else is the standard candela layout.

DEV_NAME=candela
DEV_ROOT="$HOME/Projects/candela"

# Agent view: two pi panes in the candela root.
DEV_AGENT_DIR="$HOME/Projects/candela"
DEV_AGENT_CMD="$HOME/.nvm/versions/node/v24.12.0/bin/pi"
DEV_AGENT_SESSION=candela-pi

# Editor view: nvim + gh-dash (candela repo list) on top, live actions readout
# plus infra/orchestrator shells below.
DEV_EDITOR_DIR="$HOME/Projects/candela"
DEV_EDITOR_SESSION=candela-prs
DEV_REVIEW_CMD="gh dash --config $HOME/.config/dev-workspace/candela.yml"
# Bottom strip. Commands are parallel to DEV_TERM_DIRS; "" leaves a plain shell.
# The actions pane is first so it gets the widest slot of the bottom row.
DEV_TERM_DIRS=(. candela-infra candela-orchestrator)
DEV_TERM_CMDS=(running-actions "" "")

DEV_GH_COLS=76
DEV_BOTTOM_LINES=14
