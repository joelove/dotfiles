# candela profile for dev-workspace.
# Session names are pinned to the originals so the existing tmux-resurrect save
# still matches; everything else is the standard candela layout.

DEV_NAME=candela
DEV_ROOT="$HOME/Projects/candela"

# Agent view: two pi panes in the candela root.
DEV_AGENT_DIR="$HOME/Projects/candela"
DEV_AGENT_CMD="$HOME/.nvm/versions/node/v24.12.0/bin/pi"
DEV_AGENT_SESSION=candela-pi

# Agent view defaults to the pi box's candela-pi tmux session over SSM. Run
# `cws --local` to keep the two pi panes on the Mac instead.
DEV_AGENT_TARGET=remote
DEV_AGENT_REMOTE_SESSION=candela-pi

# Editor view: croft + gh-dash (candela repo list) on top right, live actions
# readout directly below gh-dash, infra/orchestrator shells along the bottom.
DEV_EDITOR_DIR="$HOME/Projects/candela"
DEV_EDITOR_SESSION=candela-prs
DEV_REVIEW_CMD="gh dash --config $HOME/.config/dev-workspace/candela.yml"
# The editor dir is the parent of several repos, so the review tab defaults to
# a picker over the profile's repoPaths (candela.yml) rather than bare
# `lumen diff`, which errors with "not a repository".
DEV_SWAP_REVIEW_CMD="repo-review $HOME/.config/dev-workspace/candela.yml"
DEV_REVIEW_SUB_CMD="running-actions"
DEV_REVIEW_SUB_LINES=1
DEV_TERM_DIRS=(candela-infra candela-orchestrator)

DEV_GH_COLS=66
DEV_BOTTOM_LINES=14
