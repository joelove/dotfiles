# yaml-language-server: $schema=https://gh-dash.dev/schema.json

# Candela profile: open PRs across the Candela repos.
# gh-dash appends `sort:updated`, so no sort qualifier here.
prSections:
  - title: "Candela: open PRs"
    filters: >-
      is:open
      repo:Candela-Ed/candela-match
      repo:Candela-Ed/candela-eval
      repo:Candela-Ed/candela-orchestrator
      repo:Candela-Ed/candela-infra
      repo:Candela-Ed/candela-cms
      repo:Candela-Ed/candela-qa
      repo:Candela-Ed/candela-ui

# Map GitHub repos to local checkouts so checkout/diff work from the TUI.
repoPaths:
  Candela-Ed/candela-match: /Users/joelove/Projects/candela/candela-match
  Candela-Ed/candela-eval: /Users/joelove/Projects/candela/candela-eval
  Candela-Ed/candela-orchestrator: /Users/joelove/Projects/candela/candela-orchestrator
  Candela-Ed/candela-infra: /Users/joelove/Projects/candela/candela-infra
  Candela-Ed/candela-cms: /Users/joelove/Projects/candela/candela-cms
  Candela-Ed/candela-qa: /Users/joelove/Projects/candela/candela-qa
  Candela-Ed/candela-ui: /Users/joelove/Projects/candela/candela-ui

defaults:
  view: prs
  prsLimit: 50
  refetchIntervalMinutes: 5
  preview:
    open: true

# Denser table: drop the per-section count, row separators, and row padding.
# (gh-dash's own title/separator header cannot be hidden.)
theme:
  ui:
    sectionsShowCount: false
    table:
      compact: true
      showSeparator: false

# Stock gh-dash keys: `o` opens the PR in the browser, `enter` views it.
